name: Create Journal and Yearbook Samples

'on':
  workflow_dispatch:

jobs:
  create-samples:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: python -m pip install Pillow reportlab

      - name: Run journal and yearbook tests
        run: python -m unittest -v test_journal_yearbook_creator

      - name: Create sample journal
        run: >-
          python journal_yearbook_creator.py
          --type journal
          --title "Sample Journal"
          --pages 5
          --output output

      - name: Create sample yearbook
        run: >-
          python journal_yearbook_creator.py
          --type yearbook
          --data examples/yearbook.json
          --output output

      - name: Upload sample PDFs
        uses: actions/upload-artifact@v4
        with:
          name: journal-yearbook-samples
          path: |
            output/Journal_*/*.pdf
            output/Yearbook_*/*.pdf
          if-no-files-found: error
          retention-days: 14
